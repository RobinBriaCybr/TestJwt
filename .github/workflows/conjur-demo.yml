# 10-ci-github: GitHub Actions fetches deployment credentials with its own OIDC token, no secret stored in GitHub.
# Rendered by use-cases/10-ci-github.sh into out/github/conjur-demo.yml (${VAR} from config.env);
# commit the rendered file as .github/workflows/conjur-demo.yml in the repository configured as GITHUB_REPO.
name: Secrets Manager demo kit

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ .github/workflows/conjur-demo.yml ]

permissions:
  id-token: write        # lets the job request its short-lived OIDC JWT
  contents: read

jobs:
  deploy-uat:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch UAT billing DB credentials from Secrets Manager
        uses: cyberark/conjur-action@v3.0.1
        with:
          url: https://rba-lab.secretsmgr.cyberark.cloud/api
          account: conjur
          authn_id: rba-public-github
          audience: rba-lab-conjur
          # one line, ";" with no spaces: the action takes everything after ";" literally
          secrets: data/demo-kit/vault/DEMO-UAT-BIL/billing-db/address|DB_HOST;data/demo-kit/vault/DEMO-UAT-BIL/billing-db/username|DB_USER;data/demo-kit/vault/DEMO-UAT-BIL/billing-db/password|DB_PASSWORD

      - name: Use them (GitHub masks every fetched value in the log)
        run: |
          echo "db=$DB_HOST user=$DB_USER"
          echo "password as printed by mistake: $DB_PASSWORD"
          echo "password length ${#DB_PASSWORD}, sha256 $(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-8)"
          echo "deploying billing to UAT ... OK (simulated)"
